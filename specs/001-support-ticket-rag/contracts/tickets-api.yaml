openapi: 3.1.0
info:
  title: Support Ticket API
  version: 1.0.0
  description: Ticket CRUD, comments, search, and lifecycle transitions.

servers:
  - url: /api/v1

paths:
  /tickets:
    get:
      operationId: listTickets
      summary: List tickets with optional search and filter
      parameters:
        - name: q
          in: query
          description: Keyword search on title and description
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sort
          in: query
          schema:
            type: string
            default: createdAt,desc
      responses:
        '200':
          description: Paginated ticket list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
    post:
      operationId: createTicket
      summary: Create a new ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/ValidationError'

  /tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      operationId: getTicket
      summary: Get ticket detail with comments
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTicket
      summary: Partial update of ticket fields (not status)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{ticketId}/status:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    patch:
      operationId: transitionTicketStatus
      summary: Transition ticket lifecycle status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusTransitionRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'

  /tickets/{ticketId}/comments:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      operationId: addComment
      summary: Add a comment to a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]

    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    Category:
      type: string
      enum: [PAYMENT, SHIPMENT, ACCOUNT, GENERAL]

    TicketSummary:
      type: object
      required: [id, displayId, title, status, priority]
      properties:
        id:
          type: string
          format: uuid
        displayId:
          type: string
          example: TKT-1001
        title:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/Category'
        assignee:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Comment:
      type: object
      required: [id, content, author, createdAt]
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time

    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/TicketSummary'
        - type: object
          required: [description, comments]
          properties:
            description:
              type: string
            resolution:
              type: string
              nullable: true
            comments:
              type: array
              items:
                $ref: '#/components/schemas/Comment'

    TicketPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer

    CreateTicketRequest:
      type: object
      required: [title, description, priority]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        priority:
          $ref: '#/components/schemas/Priority'
        assignee:
          type: string
          maxLength: 100
        category:
          $ref: '#/components/schemas/Category'

    UpdateTicketRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        priority:
          $ref: '#/components/schemas/Priority'
        assignee:
          type: string
          maxLength: 100
          nullable: true
        category:
          $ref: '#/components/schemas/Category'

    StatusTransitionRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
        resolution:
          type: string
          description: Required when status is RESOLVED

    CreateCommentRequest:
      type: object
      required: [content, author]
      properties:
        content:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
          maxLength: 100

    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    ValidationError:
      description: Validation failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    StateConflict:
      description: Invalid state transition
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
